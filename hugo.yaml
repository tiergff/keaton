# Hugo configuration file
title: 巴斯特基顿库

# import hextra as module
# module:
#   imports:
#     - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true

defaultContentLanguage: zh

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: 影像区
      pageRef: /films
      weight: 1
    - name: 图片区
      pageRef: /pics
      weight: 2
    - name: 书籍区
      pageRef: /books
      weight: 3
    - name: 专辑区
      pageRef: /albums
      weight: 4
    - name: 翻译区
      pageRef: /translate
      weight: 5
    - name: 文档区
      pageRef: /document
      weight: 6
    - name: 博客
      pageRef: /blog
      weight: 7
    - name: 关于
      pageRef: /about
      weight: 8
    - name: Search
      weight: 9
      params:
        type: search


params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 35
      height: 35
      # link: /

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
    
  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
